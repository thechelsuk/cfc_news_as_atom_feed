name: Update Chelsea FC Atom feed

on:
  schedule:
    # GitHub's minimum supported interval is 5 minutes. Under load, GitHub
    # may delay scheduled runs (sometimes by 10-20+ min) - this is a
    # platform-level limitation, not something this workflow controls.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate feed
        run: |
          mkdir -p docs
          python3 chelsea_rss.py \
            --out docs/feed.xml \
            --limit 30 \
            --self-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --cached --quiet; then
            echo "No changes to feed - skipping commit."
          else
            git commit -m "Update feed.xml [skip ci]"
            git push
          fi
