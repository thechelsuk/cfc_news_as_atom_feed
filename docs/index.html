<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chelsea FC — Latest News Feed</title>
  <link rel="alternate" type="application/atom+xml" title="Chelsea FC - Latest News" href="feed.xml">
  <style>
    :root {
      --cfc-blue: #0033a0;
      --cfc-blue-dark: #00205b;
      --paper: #f7f8fa;
      --ink: #12151c;
      --muted: #5b6472;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .crest {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--cfc-blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--cfc-blue-dark);
    }

    p.sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 28px;
    }

    .feed-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      background: var(--cfc-blue);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: 8px;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .feed-link:hover {
      background: var(--cfc-blue-dark);
      transform: translateY(-1px);
    }

    .feed-link:focus-visible {
      outline: 3px solid #ffb703;
      outline-offset: 3px;
    }

    .feed-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .updated {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="crest">CFC</div>
    <h1>Chelsea FC — Latest News</h1>
    <p class="sub">Unofficial Atom feed, refreshed automatically. Add the link below to any feed reader.</p>

    <a class="feed-link" href="feed.xml">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11a9 9 0 0 1 9 9"></path>
        <path d="M4 4a16 16 0 0 1 16 16"></path>
        <circle cx="5" cy="19" r="1"></circle>
      </svg>
      Subscribe to Atom Feed
    </a>

    <p class="updated">Rebuilt every 5 minutes via GitHub Actions.</p>
  </div>
</body>
</html>
